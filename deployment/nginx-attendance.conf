# ==============================================================================
# Nginx Configuration for AIIMS CDER Attendance + EMS
# Target Server: Ubuntu 26.04 LTS | Private IP: 192.168.14.224
# Intranet Model: Private Subnet (192.168.14.0/24) | Hospital LAN / VPN Only
# Path on server: /etc/nginx/sites-available/attendance.conf
# Enabled via: sudo ln -s /etc/nginx/sites-available/attendance.conf /etc/nginx/sites-enabled/
# ==============================================================================

# Upstream Node.js application process (Node 22 LTS listening on loopback)
upstream attendance_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ==============================================================================
# TIER 1 (PREFERRED): HTTPS with AIIMS Institutional CA Certificate
# Used when AIIMS IT provisions an internal DNS name (e.g. attendance.cder.aiims.internal)
# and signs an institutional SSL/TLS certificate.
# ==============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name attendance.cder.aiims.internal attendance.cder.aiims.edu 192.168.14.224;

    # Institutional CA Certificate Paths (provided by AIIMS Network/Security Admin)
    # Fallback to self-signed cert if institutional CA cert is pending
    ssl_certificate     /etc/ssl/certs/attendance-institutional.crt;
    ssl_certificate_key /etc/ssl/private/attendance-institutional.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers for Intranet Access
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload buffer sizing (20MB max body for checkin photos/documents)
    client_max_body_size 20M;
    client_body_buffer_size 256k;

    # Rotational HDD-optimized proxy buffers (reduces disk swapping on 4 GB RAM)
    proxy_buffers 8 16k;
    proxy_buffer_size 16k;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Gzip Compression (reduces LAN network transfer)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # Forward traffic to Express backend
    location / {
        proxy_pass http://attendance_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # Direct static serving of uploads directory
    location /uploads/ {
        alias /var/www/attendance/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "private, no-transform";
        try_files $uri @backend_proxy;
    }

    location @backend_proxy {
        proxy_pass http://attendance_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Deny access to hidden files and SQLite database files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(sqlite|sqlite3|db)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ==============================================================================
# TIER 2: HTTP Server Block (Port 80)
# Behavior depends on whether HTTPS is active:
# - If Institutional HTTPS is active: redirects intranet HTTP to HTTPS.
# - If HTTP-only LAN mode is used during initial staging: proxies directly to backend.
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name attendance.cder.aiims.internal attendance.cder.aiims.edu 192.168.14.224 localhost;

    # Maximum file upload size
    client_max_body_size 20M;
    client_body_buffer_size 256k;

    # Option A: Redirect HTTP to HTTPS (active when certificates are in place)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # Option B: Direct HTTP proxy (for hospital intranet staging before CA cert)
    location / {
        proxy_pass http://attendance_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads/ {
        alias /var/www/attendance/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "private, no-transform";
        try_files $uri @http_backend_proxy;
    }

    location @http_backend_proxy {
        proxy_pass http://attendance_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(sqlite|sqlite3|db)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
