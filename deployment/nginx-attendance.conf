# Nginx Reverse Proxy Configuration for Attendance + EMS
# Path on server: /etc/nginx/sites-available/attendance.conf
# Enabled via: sudo ln -s /etc/nginx/sites-available/attendance.conf /etc/nginx/sites-enabled/

# Upstream Node.js application process
upstream attendance_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP - Redirect all traffic to HTTPS (Managed by Certbot or manual)
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.gov.in; # Replace with your official domain or server IP

    # Let's Encrypt ACME challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.gov.in; # Replace with your official domain

    # SSL Certificates (Configure with Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/your-domain.gov.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.gov.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS & Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Maximum file upload size (matches Express 20mb limit for checkin photos/docs)
    client_max_body_size 20M;
    client_body_buffer_size 128k;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Root location forwarding to Express backend
    location / {
        proxy_pass http://attendance_backend;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Disable buffering for live updates
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # Uploads direct serving or caching (optional optimization)
    location /uploads/ {
        alias /var/www/attendance/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "private, no-transform";
        try_files $uri @backend_proxy;
    }

    location @backend_proxy {
        proxy_pass http://attendance_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny access to hidden files and sqlite files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(sqlite|sqlite3|db)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

