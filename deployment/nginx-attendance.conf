# Nginx Configuration for AIIMS CDER Attendance + EMS
# Target Server: Ubuntu 26.04 LTS | Private IP: 192.168.14.224
# Path on server: /etc/nginx/sites-available/attendance.conf
# Enabled via: sudo ln -s /etc/nginx/sites-available/attendance.conf /etc/nginx/sites-enabled/

# Upstream Node.js application process listening on loopback
upstream attendance_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ==============================================================================
# HTTP Server Block (Port 80)
# Supports direct intranet IP access: http://192.168.14.224
# If internal HTTPS is enabled, redirect to HTTPS or serve directly on HTTP
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name 192.168.14.224 attendance.cder.aiims.internal localhost;

    # Maximum file upload size (photos & leave proofs)
    client_max_body_size 20M;
    client_body_buffer_size 256k;

    # HDD-optimized proxy buffers (reduces disk swapping on 4 GB RAM)
    proxy_buffers 8 16k;
    proxy_buffer_size 16k;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Security Headers for Intranet Access
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression (reduces LAN bandwidth usage)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # Forward all requests to Express application
    location / {
        proxy_pass http://attendance_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # Direct static serving of uploads
    location /uploads/ {
        alias /var/www/attendance/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "private, no-transform";
        try_files $uri @backend_proxy;
    }

    location @backend_proxy {
        proxy_pass http://attendance_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block access to hidden and SQLite database files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(sqlite|sqlite3|db)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

