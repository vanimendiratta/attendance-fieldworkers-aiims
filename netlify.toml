[build]
  publish = "public"
  command = ""

# Proxy all /api/* requests to the Vercel backend
[[redirects]]
  from = "/api/*"
  to = "https://attendance-fieldworkers-aiims.vercel.app/api/:splat"
  status = 200
  force = true

# SPA fallback for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
