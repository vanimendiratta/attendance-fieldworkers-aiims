[build]
  publish = "public"
  command = ""

# Proxy all /api/* requests to the Render backend
# UPDATE the `to` URL below after deploying on Render.com
[[redirects]]
  from = "/api/*"
  to = "https://aiims-attendance-api.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
