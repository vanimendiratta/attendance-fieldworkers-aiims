services:
  - type: web
    name: attendance-fieldworkers-aiims
    env: node
    plan: free
    buildCommand: npm install && cd ems && npm install
    startCommand: node server.js
    healthCheckPath: /api/organizations
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/attendance.db
      - key: PORT
        value: 10000
      - key: UPLOADS_PATH
        value: /data/uploads
